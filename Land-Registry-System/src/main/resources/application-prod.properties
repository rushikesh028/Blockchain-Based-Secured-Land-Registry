server.port=${SERVER_PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://mysql:3306/landregistry?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:landregistry}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

spring.h2.console.enabled=false

app.jwt.secret=${APP_JWT_SECRET}
app.security.relaxed=false
app.security.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:https://your-domain.com}
app.seed-default-users=false
app.seed-demo-data=false

management.endpoint.health.show-details=never
