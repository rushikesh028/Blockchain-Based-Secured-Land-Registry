
# Land Registry Blockchain - Application Configuration
spring.application.name=land-registry-blockchain

# Server Configuration
server.port=8080
server.error.include-message=always
server.error.include-binding-errors=always

# H2 In-Memory Database (Development)
spring.datasource.url=jdbc:h2:mem:land_registry_db;
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=USERNAME
spring.datasource.password=PASSWORD

# H2 Web Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT Configuration
app.jwt.secret=${APP_JWT_SECRET:land-registry-blockchain-jwt-secret-key-256-bits-secure-2024}
# 24 hours in milliseconds
app.jwt.expiration=86400000

app.security.relaxed=true
app.security.allowed-origins=http://localhost:63342,http://127.0.0.1:63342,http://localhost:8080,http://127.0.0.1:8080
app.seed-default-users=true
app.seed-demo-data=true

# Optional admin bootstrap for non-dev environments
app.bootstrap.admin.username=
app.bootstrap.admin.password=
app.bootstrap.admin.full-name=Platform Administrator
app.bootstrap.admin.email=admin@example.com

# Logging Configuration
logging.level.com.landregistry=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# Actuator Configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.info.app.name=Land Registry Blockchain
management.info.app.version=1.0.0

# Jackson Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss
